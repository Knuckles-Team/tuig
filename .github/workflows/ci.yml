name: CI

# The fleet fast-PR standard (pipelines reference/ci-standard.md). A pull request
# runs the diff-scoped `gates` job (Python 3.14, affected tests) and, only when
# native sources change, `native-checks`. The caller aggregate `CI required` is
# the one required status check. Main and nightly add the full-tree gates, the
# full suite with the Python 3.12 backward smoke, and the native wheels.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}-{1}', github.workflow, github.event.pull_request.number) || format('main-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      native: ${{ steps.f.outputs.native }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: f
        uses: dorny/paths-filter@v3
        with:
          filters: |
            native:
              - 'native/**'
              - 'tests/test_native*.py'
              - 'scripts/verify_native_wheel.py'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci.yml'

  gates:
    if: github.event_name == 'pull_request'
    uses: Knuckles-Team/pipelines/.github/workflows/gates_pipeline.yml@main
    with:
      config: .pre-commit-config.yaml
      python-version: '3.14'
      setup-command: |
        set -euo pipefail
        uv sync --python 3.14 --frozen --no-install-project --group test
        # The harness tests need no installed project; skip the native wheel build the pytest hook would trigger.
        echo UV_NO_SYNC=1 >> "$GITHUB_ENV"
        # The operator-owned identity catalog for the shared secrets hook arrives
        # through a repository variable the shared workflow hands to this step.
        if [ -n "${PROHIBITED_IDENTITY_CATALOG:-}" ]; then
          mkdir -p "$HOME/.config/arbora/governance"
          printf '%s' "$PROHIBITED_IDENTITY_CATALOG" > "$HOME/.config/arbora/governance/prohibited-identities.json"
        fi
      rust: true
      timeout-minutes: 15

  main-gates:
    # Full-tree gates on main and nightly.
    if: github.event_name != 'pull_request'
    uses: Knuckles-Team/pipelines/.github/workflows/gates_pipeline.yml@main
    with:
      config: .pre-commit-config.yaml
      python-version: '3.14'
      setup-command: |
        set -euo pipefail
        uv sync --python 3.14 --frozen --no-install-project --group test
        # The harness tests need no installed project; skip the native wheel build the pytest hook would trigger.
        echo UV_NO_SYNC=1 >> "$GITHUB_ENV"
        # The operator-owned identity catalog for the shared secrets hook arrives
        # through a repository variable the shared workflow hands to this step.
        if [ -n "${PROHIBITED_IDENTITY_CATALOG:-}" ]; then
          mkdir -p "$HOME/.config/arbora/governance"
          printf '%s' "$PROHIBITED_IDENTITY_CATALOG" > "$HOME/.config/arbora/governance/prohibited-identities.json"
        fi
      rust: true
      all-files: true
      timeout-minutes: 60

  full:
    if: github.event_name != 'pull_request'
    uses: Knuckles-Team/pipelines/.github/workflows/main_pipeline.yml@main
    with:
      # tuig ships a native binary and no Python module; the 3.12 floor is
      # exercised by the Python-only contract tests, not an import.
      setup-command: |
        uv sync --frozen --no-install-project --group test
      backward-python: "3.12"
      backward-module: none
      backward-test-scope: tests/test_docs_layout.py tests/test_precommit_hooks.py tests/test_native_only_runtime.py
      rust: true
      rust-manifest-path: native/tuig/Cargo.toml

  native-wheels:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/native-wheels.yml

  native-checks:
    needs: [changes]
    if: always() && (github.event_name != 'pull_request' || needs.changes.outputs.native == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'pull_request' && 15 || 60 }}
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/tuig
      - name: Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
      - name: Native format
        run: cargo +1.96.0 fmt --manifest-path native/tuig/Cargo.toml --check
      - name: Native tests
        run: cargo +1.96.0 test --locked --manifest-path native/tuig/Cargo.toml
      - name: Native Clippy
        run: cargo +1.96.0 clippy --locked --manifest-path native/tuig/Cargo.toml --all-targets -- -D warnings
      - name: Build the checkout's native terminal
        run: cargo +1.96.0 build --locked --manifest-path native/tuig/Cargo.toml --bin tuig
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.14'
      - name: Required compiled-native PTY and headless journeys
        env:
          TUI_NATIVE_TEST_BINARY: ${{ github.workspace }}/native/tuig/target/debug/tuig
          PTY_RESULTS: ${{ runner.temp }}/native-pty-results.xml
        run: |
          set -euo pipefail
          uv sync --frozen --no-install-project --group test --python 3.14
          uv run --frozen --no-sync python -c 'import os, pathlib, pty, termios, pyte; binary = pathlib.Path(os.environ["TUI_NATIVE_TEST_BINARY"]); assert binary.is_file() and os.access(binary, os.X_OK)'
          uv run --frozen --no-sync pytest tests/test_native_local_session_pty.py tests/test_native_composer_pty.py tests/test_native_public_details_pty.py tests/test_native_spatial_graph_pty.py tests/test_native_headless.py tests/test_native_continuation.py tests/test_one_shot_task_contract.py -q -rP --no-cov --junitxml="$PTY_RESULTS"
          uv run --frozen --no-sync python -c 'import os, xml.etree.ElementTree as ET; cases = ET.parse(os.environ["PTY_RESULTS"]).findall(".//testcase"); assert len(cases) == 42 and all(case.find(tag) is None for case in cases for tag in ("skipped", "failure", "error")), "All forty-two required native cases must pass without skips"'

      - name: Required local ACP child lifecycle journeys
        env:
          TUI_NATIVE_TEST_BINARY: ${{ github.workspace }}/native/tuig/target/debug/tuig
          ACP_RESULTS: ${{ runner.temp }}/native-acp-results.xml
        run: |
          uv run --frozen --no-sync --with agent-client-protocol==0.11.0 python -m pytest tests/test_native_acp.py -q -rP --no-cov --junitxml="$ACP_RESULTS"
          uv run --frozen --no-sync python -c 'import os, xml.etree.ElementTree as ET; cases = ET.parse(os.environ["ACP_RESULTS"]).findall(".//testcase"); assert len(cases) == 13 and all(case.find(tag) is None for case in cases for tag in ("skipped", "failure", "error")), "All thirteen ACP lifecycle and helper-resolution cases must pass without skips"'

      - name: Full Python suite outcomes without unexplained skips
        env:
          TUI_NATIVE_TEST_BINARY: ${{ github.workspace }}/native/tuig/target/debug/tuig
          SUITE_RESULTS: ${{ runner.temp }}/suite-results.xml
        run: |
          set -euo pipefail
          uv run --frozen --no-sync --with agent-client-protocol==0.11.0 python -m pytest tests -q -rs --no-cov -p no:randomly --junitxml="$SUITE_RESULTS" || true
          python3 scripts/verify_suite_outcomes.py "$SUITE_RESULTS"

  cargo-advisories:
    needs: [changes]
    if: always() && (github.event_name != 'pull_request' || needs.changes.outputs.native == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - name: Scan the locked native dependency graph for advisories
        run: cargo deny --manifest-path native/tuig/Cargo.toml --locked --config .config/deny.toml check advisories

  native-coverage:
    needs: [changes]
    if: always() && (github.event_name != 'pull_request' || needs.changes.outputs.native == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'pull_request' && 25 || 60 }}
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/tuig
      - name: Nightly toolchain with coverage instrumentation
        run: rustup toolchain install nightly --profile minimal --component llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.14'
      - name: Measure native line and branch coverage across unit, PTY, headless and ACP journeys
        env:
          COVERAGE_RESULTS: ${{ runner.temp }}/coverage-journeys.xml
        run: |
          set -euo pipefail
          manifest=native/tuig/Cargo.toml
          cargo +nightly llvm-cov clean --workspace --manifest-path "$manifest"
          # One instrumented profile: the crate tests and the compiled binary under the journeys.
          eval "$(cargo +nightly llvm-cov show-env --branch --export-prefix --manifest-path "$manifest")"
          cargo +nightly test --locked --manifest-path "$manifest"
          cargo +nightly build --locked --manifest-path "$manifest" --bin tuig
          export TUI_NATIVE_TEST_BINARY="$CARGO_TARGET_DIR/debug/tuig"
          uv sync --frozen --no-install-project --group test --python 3.14
          uv run --frozen --no-sync --with agent-client-protocol==0.11.0 pytest tests/test_native_local_session_pty.py tests/test_native_composer_pty.py tests/test_native_public_details_pty.py tests/test_native_spatial_graph_pty.py tests/test_native_headless.py tests/test_native_continuation.py tests/test_native_acp.py tests/test_one_shot_task_contract.py -q --no-cov -p no:randomly --junitxml="$COVERAGE_RESULTS"
          python3 scripts/verify_live_outcomes.py "$COVERAGE_RESULTS"
          cargo +nightly llvm-cov report --manifest-path "$manifest" --json --summary-only --output-path "$RUNNER_TEMP/native-coverage.json"
          python3 scripts/verify_native_coverage.py "$RUNNER_TEMP/native-coverage.json" --branches-advisory
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-coverage
          path: ${{ runner.temp }}/native-coverage.json

  docs-strict:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout the shared documentation theme
        uses: actions/checkout@v4
        with:
          repository: Knuckles-Team/pipelines
          ref: main
          path: .pipeline-theme
          persist-credentials: false
          sparse-checkout: |
            templates/mkdocs-theme
            scripts/sync_mkdocs_theme.py
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.14'
      - name: Verify the theme and build the documentation strictly
        run: |
          set -euo pipefail
          python3 .pipeline-theme/scripts/sync_mkdocs_theme.py check --root "$GITHUB_WORKSPACE" --source-root .pipeline-theme --content-source docs
          uvx --python 3.14 --with mkdocs-material==9.7.6 --with mkdocs-awesome-pages-plugin==2.10.1 mkdocs build --strict -d "$RUNNER_TEMP/site"

  ci-required:
    name: CI required
    if: always()
    needs: [gates, main-gates, full, native-wheels, native-checks, cargo-advisories, native-coverage, docs-strict]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail on any failed or cancelled job (skipped is fine)
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needed job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in failure|cancelled) echo "::error::a required job ended $r"; exit 1;; esac
          done
